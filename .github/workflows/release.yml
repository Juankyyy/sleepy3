name: Release

# Manual stable releases from main:
#
# - Pushes to dev or main never publish anything.
# - Run this workflow from main (Actions -> Release -> Run workflow) and choose
#   `minor` (v0.X.0), `patch` (v0.X.Y) or `exact` (the version in `version`).
#   It can also be dispatched with:
#
#     gh workflow run release.yml --ref main -f bump=minor
#     gh workflow run release.yml --ref main -f bump=exact -f version=0.1.6
#
# - The version comes from the highest semver tag (or from `version` with
#   `bump=exact`) and the Android version code from that version. The tag is
#   created by this workflow when the release is published; there is no version
#   bump commit.
#
# - When curated notes are used, the maintainer proposes the `<Theme>` title before
#   the release is dispatched; the notes are applied afterwards with
#   `dart run tool/apply_release_notes.dart vX.Y.Z`.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: minor (v0.X.0), patch (v0.X.Y) or exact (version)"
        type: choice
        required: true
        default: minor
        options:
          - minor
          - patch
          - exact
      version:
        description: "Exact version for bump=exact (e.g. 0.1.6)"
        type: string
        required: false

permissions:
  contents: write

# Serialize releases: two dispatches must not compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/compute-release-version.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$STORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if ((${#missing[@]} > 0)); then
            printf '::error::Missing repository secrets: %s. Releases must be signed with the release keystore.\n' "${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode >android/app/release.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release.jks\n'
          } >android/key.properties

      - name: Build signed APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "$VERSION_CODE"

      - name: Prepare release assets
        id: assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset="sleepy3-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$asset"
          sha256sum "$asset" >"${asset}.sha256"
          cat "${asset}.sha256"
          echo "apk=$asset" >>"$GITHUB_OUTPUT"
          echo "checksum=${asset}.sha256" >>"$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          bash .github/scripts/release-notes.sh "$PREVIOUS" HEAD "$TAG" >release-notes.md
          cat release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleepy3-${{ steps.version.outputs.tag }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.checksum }}
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.assets.outputs.apk }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-runs only refresh the assets. The curated title and notes of a stable
            # release must not be overwritten with the generated versions.
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
            echo "Release $TAG already exists; refreshed its assets."
            exit 0
          fi

          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --target "$TARGET" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
