name: sleepy3
description: "Zero-friction sleep tracking for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  material_3_expressive: ^1.1.7
  # 1.8.0 introduced a RoundedPolygon symbol that conflicts with
  # material_new_shapes; pin until material_3_expressive supports it.
  material_ui: 1.7.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-VariableFont.ttf
